<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Netlify 联机链路测试</title>
<style>body{max-width:48rem;margin:3rem auto;padding:0 1rem;font:16px/1.6 system-ui}pre{white-space:pre-wrap}button{padding:.5rem 1rem}</style>
<h1>Netlify 联机链路测试</h1>
<p>关闭代理后运行。只测试动态 GET、JSON POST 与响应一致性，不保存棋局，不测试数据库，也不能代表其他运营商的可用性。</p>
<button id="run">运行 20 轮测试</button>
<pre id="result" role="status"></pre>
<script type="module">
const run = document.getElementById('run'), result = document.getElementById('result');
run.addEventListener('click', async () => {
  run.disabled = true; result.textContent = '';
  const rows = [];
  try {
    for (let index = 0; index < 20; index++) {
      for (const method of ['GET', 'POST']) {
        const nonce = crypto.randomUUID(), began = performance.now();
        try {
          const response = await fetch('/.netlify/functions/probe?nonce=' + nonce, {
            method, cache: 'no-store', signal: AbortSignal.timeout(12000),
            ...(method === 'POST' ? { headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ nonce }) } : {})
          });
          const body = await response.json();
          rows.push({ method, ok: response.ok && body.ok && body.nonce === nonce, ms: Math.round(performance.now() - began) });
        } catch (error) { rows.push({ method, ok: false, ms: Math.round(performance.now() - began), error: error.message }); }
        result.textContent = JSON.stringify(rows, null, 2);
      }
      if (index < 19) await new Promise(resolve => setTimeout(resolve, 2000));
    }
    const successful = rows.filter(row => row.ok), times = successful.map(row => row.ms).sort((a, b) => a - b);
    result.textContent = `${successful.length}/${rows.length} 成功，P95 ${times[Math.ceil(times.length * .95) - 1] ?? '无'} ms\n\n` + result.textContent;
  } finally { run.disabled = false; }
});
</script>
</html>
